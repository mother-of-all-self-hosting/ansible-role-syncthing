---
- name: Verify Syncthing
  hosts: all
  become: true
  gather_facts: false

  vars:
    syncthing_verify_base_url: "http://localhost:{{ syncthing_container_http_host_bind_port }}"

    # The container image points Syncthing's home directory at
    # `/var/syncthing/config`, which the role bind-mounts from
    # `syncthing_config_path` - hence the doubled `config` below.
    # Spelling the path out keeps the role defaults (whose values are Jinja
    # expressions referring to one another) out of this play.
    syncthing_verify_config_file_path: /syncthing/config/config/config.xml

    # `syncthing_data_path`, bind-mounted into the container at `/data`.
    syncthing_verify_data_path: /syncthing/data

    # A folder created through the REST API below, to prove that Syncthing can
    # actually manage a directory on the mounted data volume.
    syncthing_verify_folder_id: molecule

    syncthing_verify_units:
      - syncthing.service

  tasks:
    - name: Verify that Syncthing works
      block:
        - name: Run the checks shared by all Syncthing scenarios
          ansible.builtin.include_tasks:
            file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Syncthing systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=syncthing.service
          register: syncthing_service_log
          changed_when: false

        - name: Show the Syncthing systemd service log
          ansible.builtin.debug:
            var: syncthing_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Syncthing verification failed. The systemd service log is printed above."
